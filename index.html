<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RecipeBook">
<meta name="theme-color" content="#c8956c">
<title>My Recipe Book</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fdf6ec; --warm: #f5e6d0; --caramel: #c8956c;
  --brown: #7a4f35; --dark: #3d2314; --accent: #e8a87c;
  --white: #fff; --gray: #888; --danger: #e07070;
  --success: #7cb87a; --shadow: 0 2px 16px rgba(122,79,53,0.10); --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--cream); font-family:'Zen Maru Gothic',sans-serif; color:var(--dark); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); }
.app { display:flex; flex-direction:column; min-height:100vh; max-width:520px; margin:0 auto; }

/* HEADER */
header { background:var(--white); padding:16px 20px 12px; box-shadow:0 2px 8px rgba(122,79,53,0.07); position:sticky; top:0; z-index:100; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.logo { font-family:'Shippori Mincho',serif; font-size:1.3rem; color:var(--brown); font-weight:700; }
.logo span { color:var(--caramel); }
.header-btn { background:var(--caramel); color:white; border:none; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; font-family:inherit; font-weight:700; transition:all 0.2s; }
.header-btn:hover { background:var(--brown); transform:translateY(-1px); }
.search-bar { display:flex; gap:8px; align-items:center; background:var(--cream); border-radius:24px; padding:8px 14px; border:1.5px solid var(--warm); }
.search-bar input { flex:1; border:none; background:none; font-family:inherit; font-size:0.85rem; color:var(--dark); outline:none; }
.search-bar input::placeholder { color:#bbb; }
.search-icon { color:var(--caramel); }

/* TABS */
.tabs { display:flex; background:var(--white); border-bottom:1px solid var(--warm); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex-shrink:0; padding:10px 16px; font-size:0.78rem; font-family:inherit; border:none; background:none; cursor:pointer; color:var(--gray); border-bottom:2.5px solid transparent; transition:all 0.2s; font-weight:500; }
.tab.active { color:var(--caramel); border-bottom-color:var(--caramel); font-weight:700; }

main { flex:1; padding:16px; }
.view { display:none; }
.view.active { display:block; }
.recipe-grid { display:flex; flex-direction:column; gap:12px; }

/* RECIPE CARD */
.recipe-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; animation:fadeUp 0.3s ease both; transition:transform 0.2s,box-shadow 0.2s; cursor:pointer; }
.recipe-card:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(122,79,53,0.14); }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* CARD PHOTO */
.card-photo { width:100%; height:180px; object-fit:cover; display:block; background:var(--warm); }
.card-photo-placeholder { width:100%; height:120px; background:linear-gradient(135deg,var(--warm),#eddfc8); display:flex; align-items:center; justify-content:center; font-size:3.5rem; }

.card-body { padding:14px 16px 12px; }
.card-header-row { display:flex; align-items:flex-start; gap:10px; }
.card-emoji { font-size:1.6rem; flex-shrink:0; line-height:1; }
.card-info { flex:1; min-width:0; }
.card-title { font-family:'Shippori Mincho',serif; font-size:1rem; font-weight:600; color:var(--brown); margin-bottom:3px; }
.card-meta { font-size:0.72rem; color:var(--gray); }
.card-actions { display:flex; gap:6px; flex-shrink:0; }
.icon-btn { width:30px; height:30px; border-radius:50%; border:none; cursor:pointer; font-size:0.85rem; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.btn-edit { background:var(--warm); color:var(--brown); }
.btn-edit:hover { background:var(--caramel); color:white; }
.btn-delete { background:#ffeaea; color:var(--danger); }
.btn-delete:hover { background:var(--danger); color:white; }
.btn-cart { background:#eaf5ea; color:var(--success); }
.btn-cart:hover { background:var(--success); color:white; }

.card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag { background:var(--warm); color:var(--brown); font-size:0.68rem; padding:3px 10px; border-radius:12px; cursor:pointer; transition:background 0.2s; }
.tag:hover { background:var(--caramel); color:white; }

/* TORONTO BADGE */
.toronto-section { margin-top:10px; padding-top:10px; border-top:1px dashed var(--warm); }
.toronto-label { font-size:0.68rem; color:var(--caramel); font-weight:700; display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.toronto-items { display:flex; flex-direction:column; gap:4px; }
.toronto-item { display:flex; gap:8px; font-size:0.75rem; align-items:flex-start; }
.toronto-item-photo { width:36px; height:36px; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--warm); }
.toronto-item-info { flex:1; }
.toronto-item-en { color:var(--dark); font-weight:700; font-size:0.75rem; }
.toronto-item-store { color:var(--gray); font-size:0.68rem; }
.toronto-toggle { background:none; border:none; color:var(--caramel); font-size:0.72rem; cursor:pointer; font-family:inherit; padding:0; margin-top:6px; font-weight:700; }

/* EMPTY */
.empty { text-align:center; padding:48px 24px; color:var(--gray); font-size:0.85rem; line-height:1.8; }
.empty .big { font-size:3rem; margin-bottom:12px; }

/* DETAIL MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(61,35,20,0.5); z-index:200; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.modal-overlay.open { display:flex; }
.modal { background:var(--white); border-radius:24px 24px 0 0; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; padding:0 0 40px; animation:slideUp 0.3s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle { width:40px; height:4px; background:var(--warm); border-radius:2px; margin:16px auto 0; }
.modal-title { font-family:'Shippori Mincho',serif; font-size:1.2rem; color:var(--brown); font-weight:700; padding:16px 20px 0; }
.modal-inner { padding:0 20px; }

/* FORM */
.form-group { margin-bottom:14px; }
.form-label { font-size:0.75rem; color:var(--caramel); font-weight:700; margin-bottom:6px; display:block; letter-spacing:0.05em; }
.form-input,.form-textarea,.form-select { width:100%; padding:10px 14px; border:1.5px solid var(--warm); border-radius:10px; font-family:inherit; font-size:0.85rem; color:var(--dark); background:var(--cream); outline:none; transition:border-color 0.2s; }
.form-input:focus,.form-textarea:focus { border-color:var(--caramel); background:white; }
.form-textarea { min-height:80px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.emoji-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.emoji-btn { font-size:1.5rem; padding:6px; border-radius:8px; border:2px solid transparent; cursor:pointer; background:var(--cream); transition:all 0.15s; }
.emoji-btn.selected { border-color:var(--caramel); background:var(--warm); }
.emoji-btn:hover { transform:scale(1.15); }
.tag-input-row { display:flex; gap:8px; }
.tag-input-row .form-input { flex:1; }
.tag-add-btn { padding:10px 14px; background:var(--caramel); color:white; border:none; border-radius:10px; cursor:pointer; font-size:0.8rem; font-family:inherit; font-weight:700; transition:background 0.2s; white-space:nowrap; }
.tag-add-btn:hover { background:var(--brown); }
.tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag-removable { background:var(--warm); color:var(--brown); font-size:0.75rem; padding:4px 10px; border-radius:12px; display:flex; align-items:center; gap:6px; }
.tag-removable button { background:none; border:none; cursor:pointer; color:var(--caramel); font-size:0.9rem; line-height:1; padding:0; }
.submit-btn { width:100%; padding:14px; background:var(--caramel); color:white; border:none; border-radius:12px; font-size:0.9rem; font-family:inherit; font-weight:700; cursor:pointer; margin-top:8px; transition:all 0.2s; }
.submit-btn:hover { background:var(--brown); transform:translateY(-1px); }
.cancel-btn { width:100%; padding:12px; background:var(--warm); color:var(--brown); border:none; border-radius:12px; font-size:0.85rem; font-family:inherit; font-weight:700; cursor:pointer; margin-top:8px; transition:all 0.2s; }
.cancel-btn:hover { background:#e8d0b8; }

/* PHOTO UPLOAD IN FORM */
.photo-upload-area { border:2px dashed var(--warm); border-radius:12px; padding:16px; text-align:center; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
.photo-upload-area:hover { border-color:var(--caramel); background:#fffaf5; }
.photo-preview { width:100%; max-height:160px; object-fit:cover; border-radius:8px; display:none; margin-bottom:8px; }
.photo-preview.show { display:block; }
.photo-url-row { display:flex; gap:8px; margin-top:8px; }
.photo-url-row .form-input { flex:1; font-size:0.8rem; }
.photo-url-btn { padding:10px 12px; background:var(--brown); color:white; border:none; border-radius:10px; cursor:pointer; font-size:0.75rem; font-family:inherit; font-weight:700; white-space:nowrap; }
.or-divider { color:var(--gray); font-size:0.72rem; margin:8px 0; }


/* IMPORT MODE TABS */
.import-mode-btn {
  flex:1; padding:7px; border-radius:8px; font-size:0.75rem;
  font-family:inherit; font-weight:700; cursor:pointer;
  border:1.5px solid var(--warm); background:white; color:var(--gray);
  transition:all 0.2s;
}
.import-mode-btn.active { background:var(--caramel); color:white; border-color:var(--caramel); }
/* URL IMPORT */
.url-import-box { background:linear-gradient(135deg,#fff8f2,#fdf0e4); border:2px dashed var(--caramel); border-radius:14px; padding:18px; margin-bottom:16px; }
.url-import-title { font-size:0.78rem; color:var(--caramel); font-weight:700; margin-bottom:10px; }
.url-input-row { display:flex; gap:8px; }
.url-input-row .form-input { flex:1; font-size:0.8rem; }
.url-fetch-btn { padding:10px 14px; background:var(--brown); color:white; border:none; border-radius:10px; cursor:pointer; font-size:0.78rem; font-family:inherit; font-weight:700; transition:background 0.2s; white-space:nowrap; }
.url-fetch-btn:hover { background:var(--dark); }
.url-fetch-btn:disabled { opacity:0.5; cursor:not-allowed; }
.url-status { margin-top:10px; font-size:0.75rem; color:var(--gray); display:none; }
.url-status.show { display:block; }
.url-status.success { color:var(--success); }
.url-status.error { color:var(--danger); }

/* AI */
.ai-spinner { display:none; text-align:center; padding:12px; color:var(--caramel); font-size:0.85rem; }
.ai-spinner.show { display:block; }
.spinner-icon { display:inline-block; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.ai-result { background:var(--cream); border-radius:12px; padding:14px; font-size:0.82rem; line-height:1.7; color:var(--dark); display:none; margin-top:12px; white-space:pre-wrap; }
.ai-result.show { display:block; }

/* SHOPPING */
.shopping-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.shopping-title { font-family:'Shippori Mincho',serif; font-size:1.1rem; color:var(--brown); font-weight:700; }
.clear-btn { font-size:0.75rem; color:var(--danger); background:#ffeaea; border:none; padding:6px 12px; border-radius:12px; cursor:pointer; font-family:inherit; }
.shopping-recipe-group { margin-bottom:20px; }
.shopping-recipe-name { font-size:0.78rem; color:var(--caramel); font-weight:700; letter-spacing:0.08em; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.shopping-item { display:flex; align-items:center; gap:12px; padding:10px 14px; background:white; border-radius:10px; margin-bottom:6px; box-shadow:0 1px 4px rgba(122,79,53,0.06); transition:all 0.2s; cursor:pointer; }
.shopping-item.done { opacity:0.45; }
.shopping-item.done .item-text { text-decoration:line-through; }
.shopping-check { width:20px; height:20px; border:2px solid var(--caramel); border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:white; background:transparent; transition:all 0.2s; }
.shopping-check.checked { background:var(--caramel); }
.item-text { font-size:0.85rem; flex:1; }
.item-amount { font-size:0.78rem; color:var(--caramel); font-weight:700; }

/* CAT FILTER */
.cat-filter { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.cat-chip { padding:5px 14px; border-radius:16px; font-size:0.75rem; border:1.5px solid var(--warm); background:white; color:var(--gray); cursor:pointer; font-family:inherit; transition:all 0.2s; }
.cat-chip.active { background:var(--caramel); color:white; border-color:var(--caramel); font-weight:700; }


/* LOADING */
#loadingOverlay {
  position:fixed; inset:0; background:rgba(253,246,236,0.85);
  z-index:999; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:12px;
}
.loading-spinner {
  width:40px; height:40px; border:4px solid var(--warm);
  border-top-color:var(--caramel); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
.loading-text { font-size:0.85rem; color:var(--caramel); font-weight:700; }
/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--dark); color:white; padding:10px 20px; border-radius:20px; font-size:0.82rem; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* DETAIL VIEW */
.detail-photo { width:100%; max-height:260px; object-fit:cover; border-radius:0; }
.detail-photo-placeholder { width:100%; height:180px; background:linear-gradient(135deg,var(--warm),#eddfc8); display:flex; align-items:center; justify-content:center; font-size:5rem; }
.detail-section { margin-top:16px; }
.detail-section-title { font-size:0.72rem; color:var(--caramel); font-weight:700; letter-spacing:0.1em; margin-bottom:8px; }
.detail-ingredients { display:flex; flex-direction:column; gap:6px; }
.detail-ingredient-row { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--cream); border-radius:10px; }
.detail-ing-jp { flex:1; font-size:0.82rem; }
.detail-ing-en { font-size:0.72rem; color:var(--caramel); font-weight:700; }
.detail-ing-store { font-size:0.65rem; color:var(--gray); }
.detail-steps { display:flex; flex-direction:column; gap:8px; }
.detail-step { display:flex; gap:10px; }
.step-num { width:22px; height:22px; background:var(--caramel); color:white; border-radius:50%; font-size:0.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.step-text { font-size:0.82rem; line-height:1.6; flex:1; }
.section-divider { height:1px; background:var(--warm); margin:14px 0; }

/* PWA INSTALL BANNER */
.install-banner {
  position:fixed; bottom:0; left:0; right:0; z-index:500;
  background:white; border-top:1px solid var(--warm);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:12px;
  box-shadow:0 -4px 20px rgba(122,79,53,0.12);
  max-width:520px; margin:0 auto;
}
.install-banner.show { display:flex; }
.install-icon { font-size:2.2rem; flex-shrink:0; }
.install-text { flex:1; }
.install-title { font-family:'Shippori Mincho',serif; font-size:0.9rem; color:var(--brown); font-weight:700; }
.install-sub { font-size:0.72rem; color:var(--gray); margin-top:2px; }
.install-btn { background:var(--caramel); color:white; border:none; padding:8px 16px; border-radius:20px; font-size:0.78rem; font-family:inherit; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.install-close { background:none; border:none; color:var(--gray); font-size:1.2rem; cursor:pointer; padding:4px; flex-shrink:0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <div class="logo">My <span>Recipe</span> Book 🍳</div>
      <button class="header-btn" onclick="openAddModal()">＋ レシピ追加</button>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="レシピ名・材料で検索..." oninput="renderAll()">
    </div>
  </header>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('recipes',this)">📋 レシピ一覧</button>
    <button class="tab" onclick="switchTab('shopping',this)">🛒 買い物リスト</button>
  </div>
  <main>
    <div id="view-recipes" class="view active">
      <div class="cat-filter" id="catFilter"></div>
      <div class="recipe-grid" id="recipeGrid"></div>
    </div>
    <div id="view-shopping" class="view">
      <div class="shopping-header">
        <div class="shopping-title">🛒 買い物リスト</div>
        <button class="clear-btn" onclick="clearShopping()">チェックをリセット</button>
      </div>
      <div id="shoppingList"></div>
    </div>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">🍳 レシピを追加</div>
    <div class="modal-inner">
      <!-- URL IMPORT -->
      <div class="url-import-box" id="urlImportBox" style="margin-top:16px">
        <div class="url-import-title">🔗 URLからレシピを自動読み取り</div>
        <div class="url-input-row">
          <input type="url" class="form-input" id="f-url" placeholder="https://... レシピサイトのURLを貼り付け">
          <button class="url-fetch-btn" id="urlFetchBtn" onclick="importFromUrl()">読み取る</button>
        </div>
        <div class="url-status" id="urlStatus"></div>
      </div>

      <!-- PHOTO -->
      <div class="form-group">
        <label class="form-label">📷 完成写真</label>
        <div class="photo-upload-area" id="photoUploadArea" onclick="document.getElementById('photoFileInput').click()">
          <img id="photoPreview" class="photo-preview" src="" alt="">
          <div id="photoUploadHint">
            <div style="font-size:1.8rem;margin-bottom:6px">📷</div>
            <div style="font-size:0.8rem;color:var(--caramel);font-weight:700">タップして写真をアップロード</div>
            <div style="font-size:0.7rem;color:var(--gray);margin-top:2px">JPG / PNG / WEBP</div>
          </div>
          <input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
        </div>
        <div class="or-divider">— または URL で指定 —</div>
        <div class="photo-url-row">
          <input type="url" class="form-input" id="f-photoUrl" placeholder="https://... 画像URL">
          <button class="photo-url-btn" onclick="applyPhotoUrl()">適用</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">絵文字アイコン</label>
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <div class="form-group">
        <label class="form-label">レシピ名 *</label>
        <input type="text" class="form-input" id="f-name" placeholder="例：ミルクレープ">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <select class="form-select" id="f-category">
            <option>スイーツ</option><option>パン・生地</option><option>和食</option>
            <option>洋食</option><option>中華</option><option>麺類</option><option>その他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">調理時間</label>
          <input type="text" class="form-input" id="f-time" placeholder="例：60分">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">材料（改行で区切る）*</label>
        <textarea class="form-textarea" id="f-ingredients" placeholder="パンケーキミックス 100g&#10;卵 1個&#10;牛乳 200ml"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">作り方</label>
        <textarea class="form-textarea" id="f-steps" placeholder="手順を書いてね..." style="min-height:100px"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">メモ・ポイント</label>
        <input type="text" class="form-input" id="f-note" placeholder="例：乳糖不耐症対応・Lactantia使用">
      </div>
      <div class="form-group">
        <label class="form-label">タグ</label>
        <div class="tag-input-row">
          <input type="text" class="form-input" id="f-tagInput" placeholder="タグを入力" onkeydown="if(event.key==='Enter'){addTag();event.preventDefault();}">
          <button class="tag-add-btn" onclick="addTag()">追加</button>
        </div>
        <div class="tag-list" id="f-tags"></div>
      </div>
      <div class="form-group">
        <label class="form-label">✨ AIで材料のトロント買い物リストを生成</label>

function addToShopping(id) {

    shoppingRecipes.push({ id:r.id, name:r.name, emoji:r.emoji, ingredients:r.ingredients });
    localStorage.setItem('shoppingRecipes', JSON.stringify(shoppingRecipes));
  }
  renderShopping();
  showToast(`🛒 ${r.name} を買い物リストに追加！`);
}

function renderShopping() {
  const el = document.getElementById('shoppingList');
  if (!shoppingRecipes.length) {
    el.innerHTML = `<div class="empty"><div class="big">🛒</div>買い物リストは空です<br>レシピの 🛒 ボタンで追加してね！</div>`;
    return;
  }
  el.innerHTML = shoppingRecipes.map(r => {
    const items = r.ingredients.split('\n').filter(Boolean);
    return `<div class="shopping-recipe-group">
      <div class="shopping-recipe-name">
        ${r.emoji} ${r.name}

      </div>
      ${items.map((item,i)=>{
        const key=`${r.id}-${i}`;
        const checked=shoppingChecked[key];
        return `<div class="shopping-item ${checked?'done':''}" onclick="toggleCheck('${key}',this)">
          <div class="shopping-check ${checked?'checked':''}">✓</div>
          <div class="item-text">${item}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function removeFromShopping(id) {
  shoppingRecipes = shoppingRecipes.filter(x=>x.id!==id);
  localStorage.setItem('shoppingRecipes', JSON.stringify(shoppingRecipes));
  renderShopping();
}
function toggleCheck(key,el) {
  shoppingChecked[key]=!shoppingChecked[key];
  localStorage.setItem('shoppingChecked', JSON.stringify(shoppingChecked));
  el.classList.toggle('done');
  el.querySelector('.shopping-check').classList.toggle('checked');
}
function clearShopping() {

function saveRecipe() {
  const name=document.getElementById('f-name').value.trim();
  const ingredients=document.getElementById('f-ingredients').value.trim();
  if (!name||!ingredients) { showToast('⚠️ レシピ名と材料は必須です'); return; }
  const data = {
    emoji:selectedEmoji, name,
    category:document.getElementById('f-category').value,
    time:document.getElementById('f-time').value.trim(),
    photo:currentPhotoData,
    ingredients,
    steps:document.getElementById('f-steps').value.trim(),
    note:document.getElementById('f-note').value.trim(),
    tags:currentTags,
    createdAt:new Date().toLocaleDateString('ja-JP')
  };
  if (editingId) {
    const idx=recipes.findIndex(r=>r.id===editingId);
    if (idx!==-1) recipes[idx]={...recipes[idx],...data};
    showToast('✅ 更新しました！');
  } else {
    recipes.unshift({id:Date.now(),...data});

  }

async function deleteRecipe(id) {

    await loadRecipes();
    showToast('🗑️ 削除しました');
  } catch(e) {
    showToast('⚠️ 削除に失敗しました');

  showLoading(false);
}

// ========== URL IMPORT ==========
async function callAIWithRetry(messages, tools, maxRetries=3) {
  // AIのレスポンスが tool_use の場合、tool_result を返して会話を続ける
  let msgs = [...messages];
  for (let attempt=0; attempt<maxRetries; attempt++) {
    const body = { model:'claude-sonnet-4-20250514', max_tokens:3000, messages:msgs };
    if (tools) body.tools = tools;
    const res = await fetch('https://eiihdccxzksnlqhtdwha.supabase.co/functions/v1/ai-proxy', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpaWhkY2N4emtzbmxxaHRkd2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDMxMDcsImV4cCI6MjA5NjAxOTEwN30.zPsrxrr8riBHrcEG41hI5ur-yFOJi0Axg4bya41Z3Zs'},
      body:JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error('API Error: ' + res.status + ' ' + err);
    }
    const data = await res.json();
    const content = data.content || [];

    // テキストからJSONを探す
    const textBlocks = content.filter(c=>c.type==='text');
    const fullText = textBlocks.map(c=>c.text).join('');
    const jsonMatch = fullText.match(/\{[\s\S]*\}/);
    if (jsonMatch) return JSON.parse(jsonMatch[0]);

    // tool_use があれば tool_result を返して続ける
    const toolUses = content.filter(c=>c.type==='tool_use');
    if (toolUses.length && data.stop_reason==='tool_use') {
      msgs.push({ role:'assistant', content });
      msgs.push({
        role:'user',
        content: toolUses.map(t=>({
          type:'tool_result', tool_use_id:t.id,
          content: '検索結果を受け取りました。レシピ情報をJSONで返してください。'
        }))
      });
      continue;
    }
    throw new Error('JSONが見つかりませんでした: ' + fullText.slice(0,200));
  }
  throw new Error('最大リトライ回数を超えました');
}

// Service Worker（キャッシュ戦略）
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'recipe-book-v1';
const ASSETS = [location.href];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll([])));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
  `;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// Install prompt
let deferredPrompt = null;

function dismissInstall() {
  const banner = document.getElementById('installBanner');
  if (banner) banner.classList.remove('show');
  localStorage.setItem('installDismissed', '1');
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) {
    setTimeout(() => {
      const banner = document.getElementById('installBanner');
      if (banner) banner.classList.add('show');
    }, 2000);
  }
});

window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('installBanner');
  if (banner) banner.classList.remove('show');
  showToast('🎉 インストール完了！');
});

window.addEventListener('load', () => {
  const installBtn = document.getElementById('installBtn');
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const {outcome} = await deferredPrompt.userChoice;
        deferredPrompt = null;
        const banner = document.getElementById('installBanner');
        if (banner) banner.classList.remove('show');
        if (outcome === 'accepted') showToast('🎉 ホーム画面に追加しました！');
      } else {
        showToast('Safari で「共有 → ホーム画面に追加」してね 📱');
        const banner = document.getElementById('installBanner');
        if (banner) banner.classList.remove('show');
      }
    });
  }

  // iOSではbeforeinstallpromptが発火しないので手動で表示
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  if (isIos && !isStandalone && !localStorage.getItem('installDismissed')) {
    setTimeout(() => {
      const banner = document.getElementById('installBanner');
      const sub = document.querySelector('.install-sub');
      if (banner) banner.classList.add('show');
      if (sub) sub.textContent = 'Safari → 共有ボタン → 「ホーム画面に追加」';
    }, 2000);
  }
});
